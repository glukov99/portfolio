<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Георги Луков</title>
<style>
@font-face {
  font-family: 'Fontello';
  src: url('fonts/fontello.woff2') format('woff2'),
       url('fonts/fontello.woff') format('woff');
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black: #080808;
  --surface: #111;
  --surface2: #181818;
  --border: rgba(255,255,255,0.08);
  --white: #f0ede8;
  --gray: #666;
  --light: #aaa;
  --accent: #fff;
  --sans: 'Fontello', 'Montserrat', sans-serif;
}

body {
  background: var(--black);
  color: var(--white);
  font-family: var(--sans);
  font-size: 13px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 48px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
  background: rgba(8,8,8,0.96);
  backdrop-filter: blur(12px);
}
.header-logo { font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--white); }
.header-sub { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gray); }
.header-right { display: flex; align-items: center; gap: 16px; }
.btn {
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  background: none; border: 1px solid var(--border); color: var(--white);
  padding: 9px 20px; cursor: pointer; font-family: var(--sans);
  transition: border-color 0.2s, background 0.2s;
}
.btn:hover { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.04); }
.btn-primary {
  border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.06);
}
.btn-primary:hover { border-color: var(--white); background: rgba(255,255,255,0.1); }

/* ── LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  min-height: calc(100vh - 73px);
}

/* ── SIDEBAR ── */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 36px 32px;
  display: flex; flex-direction: column; gap: 28px;
  position: sticky; top: 73px; height: calc(100vh - 73px);
  overflow-y: auto;
}

.field-label {
  font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--gray); display: block; margin-bottom: 10px;
}
.field-input, .field-select, .field-textarea {
  width: 100%; background: var(--surface);
  border: 1px solid var(--border); color: var(--white);
  font-family: var(--sans); font-size: 13px;
  padding: 11px 14px; outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none; appearance: none;
}
.field-input:focus, .field-select:focus, .field-textarea:focus {
  border-color: rgba(255,255,255,0.3);
}
.field-select { cursor: pointer; }
.field-textarea { resize: none; height: 70px; }

.tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag-chip {
  font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
  border: 1px solid var(--border); padding: 4px 10px; cursor: pointer;
  color: var(--gray); transition: color 0.2s, border-color 0.2s;
  background: none;font-family: var(--sans);
}
.tag-chip.on { color: var(--white); border-color: rgba(255,255,255,0.4); }

.cover-row { display: flex; align-items: center; gap: 12px; }
.toggle {
  width: 36px; height: 20px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 10px;
  position: relative; cursor: pointer; transition: background 0.2s;
  flex-shrink: 0;
}
.toggle::after {
  content: ''; position: absolute;
  width: 12px; height: 12px; background: var(--gray);
  border-radius: 50%; top: 3px; left: 3px;
  transition: transform 0.2s, background 0.2s;
}
.toggle.on { background: rgba(255,255,255,0.12); }
.toggle.on::after { transform: translateX(16px); background: var(--white); }
.cover-label { font-size: 11px; color: var(--light); }

.sidebar-actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

/* STATUS BAR */
.status-bar {
  font-size: 10px; letter-spacing: 0.1em; padding: 10px 14px;
  border: 1px solid var(--border); color: var(--gray);
  display: none;
}
.status-bar.show { display: block; }
.status-bar.ok { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); }
.status-bar.err { border-color: rgba(255,80,80,0.3); color: rgba(255,120,120,0.9); }

/* ── MAIN ── */
.main { padding: 48px; display: flex; flex-direction: column; gap: 40px; }

/* DROP ZONE */
.drop-zone {
  border: 1px dashed rgba(255,255,255,0.15);
  padding: 64px 40px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.25s, background 0.25s;
  position: relative;
}
.drop-zone.over { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.03); }
.drop-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
}
.drop-icon { font-size: 32px; margin-bottom: 20px; opacity: 0.2; }
.drop-title { font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--light); margin-bottom: 8px; }
.drop-sub { font-size: 11px; color: var(--gray); }

/* QUEUE */
.queue-header {
  display: flex; align-items: center; justify-content: space-between;
}
.queue-title { font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gray); }
.queue-count {
  font-size: 9px; letter-spacing: 0.15em; color: var(--gray);
  border: 1px solid var(--border); padding: 3px 10px;
}
.queue-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 3px; margin-top: 16px;
}
.queue-item {
  position: relative; aspect-ratio: 4/3; overflow: hidden;
  background: var(--surface);
}
.queue-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
.queue-item-name {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 8px 10px;
  background: rgba(0,0,0,0.7);
  font-size: 10px; color: var(--light); letter-spacing: 0.05em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.queue-remove {
  position: absolute; top: 6px; right: 6px;
  background: rgba(0,0,0,0.7); border: none; color: var(--white);
  width: 22px; height: 22px; cursor: pointer; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s;
}
.queue-item:hover .queue-remove { opacity: 1; }

/* EXISTING PHOTOS */
.existing-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 3px; margin-top: 16px;
}
.existing-item {
  position: relative; aspect-ratio: 4/3; overflow: hidden;
  background: var(--surface); cursor: pointer;
}
.existing-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; transition: opacity 0.3s; }
.existing-item:hover img { opacity: 0.8; }
.existing-badge {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 6px 8px; background: rgba(0,0,0,0.75);
  font-size: 9px; color: var(--light); letter-spacing: 0.06em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.existing-album-tag {
  position: absolute; top: 6px; left: 6px;
  font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase;
  background: rgba(0,0,0,0.8); color: var(--gray); padding: 2px 6px;
}
.existing-cover-tag {
  position: absolute; top: 6px; right: 6px;
  font-size: 8px; letter-spacing: 0.1em;
  background: rgba(255,255,255,0.15); color: var(--white); padding: 2px 6px;
}

/* SECTION LABEL */
.section-head { border-top: 1px solid var(--border); padding-top: 32px; }

/* MODAL */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  z-index: 200; display: none; align-items: center; justify-content: center;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  padding: 40px; width: 480px; max-width: 90vw;
}
.modal h3 { font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 28px; }
.modal-actions { display: flex; gap: 10px; margin-top: 28px; }
.modal-fields { display: flex; flex-direction: column; gap: 18px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="header-logo">Георги Луков</div>
    <div class="header-sub">Admin Panel</div>
  </div>
  <div class="header-right">
    <a href="albums/index.html" target="_blank"><button class="btn">Виж сайта ↗</button></a>
    <button class="btn btn-primary" onclick="exportPhotosJS()">Запази photos.js</button>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <label class="field-label">Албум</label>
      <select class="field-select" id="selAlbum">
        <option value="">— Избери албум —</option>
      </select>
    </div>

    <div>
      <label class="field-label">Заглавие</label>
      <input class="field-input" id="inpTitle" type="text" placeholder="La Morelle SS25">
    </div>

    <div>
      <label class="field-label">Тагове</label>
      <div class="tags-wrap" id="tagsWrap"></div>
      <input class="field-input" id="inpCustomTag" type="text" placeholder="Добави таг..." style="margin-top:8px;">
    </div>

    <div>
      <label class="field-label">Корица на албума</label>
      <div class="cover-row">
        <div class="toggle" id="coverToggle" onclick="this.classList.toggle('on')"></div>
        <span class="cover-label">Показва се на началната страница</span>
      </div>
    </div>

    <div class="sidebar-actions">
      <div class="status-bar" id="statusBar"></div>
      <button class="btn btn-primary" onclick="addToQueue()">+ Добави в опашката</button>
      <button class="btn" onclick="exportPhotosJS()">💾 Запази photos.js</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- DROP ZONE -->
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">
      <div class="drop-icon">⬆</div>
      <div class="drop-title">Drag & Drop снимки тук</div>
      <div class="drop-sub">или клик за избор — JPG, PNG, WEBP</div>
    </div>

    <!-- QUEUE -->
    <div>
      <div class="queue-header">
        <div class="queue-title">Опашка за добавяне</div>
        <div class="queue-count" id="queueCount">0 снимки</div>
      </div>
      <div class="queue-grid" id="queueGrid"></div>
    </div>

    <!-- EXISTING -->
    <div class="section-head">
      <div class="queue-header">
        <div class="queue-title">Текущи снимки в photos.js</div>
        <div class="queue-count" id="existingCount">0 снимки</div>
      </div>
      <div class="existing-grid" id="existingGrid"></div>
    </div>

  </main>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <h3>Редактирай снимка</h3>
    <div class="modal-fields">
      <div>
        <label class="field-label">Заглавие</label>
        <input class="field-input" id="editTitle" type="text">
      </div>
      <div>
        <label class="field-label">Албум</label>
        <select class="field-select" id="editAlbum"></select>
      </div>
      <div>
        <label class="field-label">Тагове (разделени със запетая)</label>
        <input class="field-input" id="editTags" type="text">
      </div>
      <div>
        <label class="field-label">Корица</label>
        <div class="cover-row">
          <div class="toggle" id="editCover"></div>
          <span class="cover-label">Корица на албума</span>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveEdit()">Запази</button>
      <button class="btn" style="border-color:rgba(255,80,80,0.3);color:rgba(255,120,120,0.8)" onclick="deletePhoto()">Изтрий</button>
      <button class="btn" onclick="closeModal()">Отказ</button>
    </div>
  </div>
</div>

<script src="photos.js"></script>
<script>
// ── STATE ──────────────────────────────────────────────────────
let queue = [];       // pending files from drop zone
let photos = [...PHOTOS];  // live copy
let editIndex = null;

const PREDEFINED_TAGS = ['мода', 'кампании', 'портрети', 'продукти', 'каталог', 'концептуална', 'портрет', 'сватбена', 'балове', 'кръщене'];

// ── INIT ───────────────────────────────────────────────────────
function init() {
  // Populate album selects
  const opts = ALBUMS.map(a => `<option value="${a.id}">${a.label}</option>`).join('');
  document.getElementById('selAlbum').innerHTML = '<option value="">— Избери албум —</option>' + opts;
  document.getElementById('editAlbum').innerHTML = opts;

  // Predefined tags
  document.getElementById('tagsWrap').innerHTML = PREDEFINED_TAGS.map(t =>
    `<button class="tag-chip" onclick="toggleTag(this,'${t}')">${t}</button>`
  ).join('');

  // Custom tag on Enter
  document.getElementById('inpCustomTag').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const val = e.target.value.trim();
      if (!val) return;
      const existing = [...document.querySelectorAll('#tagsWrap .tag-chip')].find(c => c.dataset.val === val || c.textContent === val);
      if (!existing) {
        const chip = document.createElement('button');
        chip.className = 'tag-chip on';
        chip.textContent = val;
        chip.onclick = () => toggleTag(chip, val);
        document.getElementById('tagsWrap').appendChild(chip);
      } else {
        existing.classList.add('on');
      }
      e.target.value = '';
    }
  });

  renderExisting();
}

// ── TAGS ───────────────────────────────────────────────────────
function toggleTag(el, val) { el.classList.toggle('on'); }
function getSelectedTags() {
  return [...document.querySelectorAll('#tagsWrap .tag-chip.on')].map(c => c.textContent);
}

// ── DROP ZONE ──────────────────────────────────────────────────
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  handleFiles(e.dataTransfer.files);
});

function handleFiles(files) {
  [...files].forEach(file => {
    if (!file.type.startsWith('image/')) return;
    // Check not already in queue
    if (queue.find(q => q.name === file.name)) return;
    queue.push(file);
  });
  renderQueue();
}

function renderQueue() {
  const grid = document.getElementById('queueGrid');
  document.getElementById('queueCount').textContent = `${queue.length} снимки`;
  grid.innerHTML = queue.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `
      <div class="queue-item">
        <img src="${url}" alt="${f.name}">
        <div class="queue-item-name">${f.name}</div>
        <button class="queue-remove" onclick="removeFromQueue(${i})">✕</button>
      </div>`;
  }).join('');
}

function removeFromQueue(i) {
  queue.splice(i, 1);
  renderQueue();
}

// ── ADD TO QUEUE → PHOTOS ─────────────────────────────────────
function addToQueue() {
  if (queue.length === 0) return showStatus('Няма снимки в опашката.', 'err');
  const album = document.getElementById('selAlbum').value;
  if (!album) return showStatus('Избери албум!', 'err');

  const title = document.getElementById('inpTitle').value.trim() || queue[0].name.replace(/\.[^.]+$/, '');
  const tags = getSelectedTags();
  const cover = document.getElementById('coverToggle').classList.contains('on');

  // If cover, unset existing covers for this album
  if (cover) {
    photos.forEach(p => { if (p.album === album) p.cover = false; });
  }

  queue.forEach((file, i) => {
    photos.push({
      file: `gallery/${file.name}`,
      album,
      title: queue.length > 1 ? `${title} ${i + 1}` : title,
      tags,
      cover: cover && i === 0
    });
  });

  showStatus(`✓ ${queue.length} снимки добавени. Сега натисни "Запази photos.js".`, 'ok');

  // Reset
  queue = [];
  renderQueue();
  document.getElementById('inpTitle').value = '';
  document.getElementById('coverToggle').classList.remove('on');
  document.querySelectorAll('#tagsWrap .tag-chip').forEach(c => c.classList.remove('on'));
  renderExisting();
}

// ── EXISTING GRID ─────────────────────────────────────────────
function renderExisting() {
  const grid = document.getElementById('existingGrid');
  document.getElementById('existingCount').textContent = `${photos.length} снимки`;
  grid.innerHTML = photos.map((p, i) => {
    const albumLabel = ALBUMS.find(a => a.id === p.album)?.label || p.album;
    return `
      <div class="existing-item" onclick="openEdit(${i})" title="${p.title}">
        <img src="img/${p.file}" alt="${p.title}" loading="lazy" onerror="this.style.opacity='0.1'">
        <div class="existing-album-tag">${albumLabel}</div>
        ${p.cover ? '<div class="existing-cover-tag">★ Корица</div>' : ''}
        <div class="existing-badge">${p.title}</div>
      </div>`;
  }).join('');
}

// ── EDIT MODAL ────────────────────────────────────────────────
function openEdit(i) {
  editIndex = i;
  const p = photos[i];
  document.getElementById('editTitle').value = p.title;
  document.getElementById('editAlbum').value = p.album;
  document.getElementById('editTags').value = (p.tags || []).join(', ');
  const cov = document.getElementById('editCover');
  cov.className = 'toggle' + (p.cover ? ' on' : '');
  cov.onclick = () => cov.classList.toggle('on');
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  editIndex = null;
}

function saveEdit() {
  if (editIndex === null) return;
  const p = photos[editIndex];
  const cover = document.getElementById('editCover').classList.contains('on');
  const album = document.getElementById('editAlbum').value;

  if (cover) photos.forEach((ph, i) => { if (ph.album === album && i !== editIndex) ph.cover = false; });

  photos[editIndex] = {
    ...p,
    title: document.getElementById('editTitle').value.trim() || p.title,
    album,
    tags: document.getElementById('editTags').value.split(',').map(t => t.trim()).filter(Boolean),
    cover
  };

  closeModal();
  renderExisting();
  showStatus('✓ Промените са запазени. Натисни "Запази photos.js".', 'ok');
}

function deletePhoto() {
  if (editIndex === null) return;
  if (!confirm(`Изтриваш "${photos[editIndex].title}"?`)) return;
  photos.splice(editIndex, 1);
  closeModal();
  renderExisting();
  showStatus('✓ Снимката е премахната. Натисни "Запази photos.js".', 'ok');
}

// ── EXPORT photos.js ─────────────────────────────────────────
function exportPhotosJS() {
  const albumsStr = JSON.stringify(ALBUMS, null, 2).replace(/"([^"]+)":/g, '$1:');
  const photosStr = photos.map(p => {
    const tagsStr = JSON.stringify(p.tags);
    return `  { file: "${p.file}", album: "${p.album}", title: "${p.title}", tags: ${tagsStr}, cover: ${p.cover} }`;
  }).join(',\n');

  const output = `// ============================================================
//  PHOTOS.JS — единственият файл, който трябва да редактираш
//  за да добавиш нови снимки към сайта.
//
//  Как се добавя нова снимка:
//  1. Копирай снимката в папка /img/gallery/
//  2. Добави нов ред тук по примера по-долу
//  3. Качи промените в GitHub — готово!
// ============================================================

const ALBUMS = ${albumsStr};

const PHOTOS = [
${photosStr}
];
`;

  const blob = new Blob([output], { type: 'text/javascript' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'photos.js';
  a.click();

  showStatus('✓ photos.js изтеглен! Замени стария файл в папката на сайта.', 'ok');
}

// ── STATUS ────────────────────────────────────────────────────
function showStatus(msg, type) {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = `status-bar show ${type}`;
  clearTimeout(bar._t);
  bar._t = setTimeout(() => bar.classList.remove('show'), 5000);
}

// Close modal on backdrop click
document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === document.getElementById('editModal')) closeModal();
});

init();
</script>
</body>
</html>
