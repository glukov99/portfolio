<style>
.contact-grid {

.contact-info { padding: 80px 60px; border-right: 1px solid var(--border); }

.contact-detail { margin-bottom: 36px; }

.form-input:focus, .form-textarea:focus { border-bottom-color: var(--white); }

.form-submit {

  transition: border-color 0.25s, background 0.25s;
}
.form-submit:hover { border-color: var(--white); background: rgba(255,255,255,0.05); }
