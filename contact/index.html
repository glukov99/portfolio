<style>
.contact-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0; min-height: calc(100vh - 300px);
}
.contact-info { padding: 80px 60px; border-right: 1px solid var(--border); }
.contact-info h2 {
  font-size: clamp(28px, 4vw, 48px); font-weight: 400;
  text-transform: uppercase; margin-bottom: 48px; line-height: 1.1;
}
.contact-detail { margin-bottom: 36px; }
.contact-detail-label {
  font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gray); margin-bottom: 8px;
}
.contact-detail-value {
  font-size: 16px; color: var(--white);
}
.contact-detail-value a { transition: color 0.2s; }
.contact-detail-value a:hover { color: var(--gray); }

.contact-form { padding: 80px 60px; }
.contact-greeting {
  font-family: var(--serif); font-style: italic; font-weight: 400;
  font-size: clamp(30px, 3.6vw, 44px);
  margin-bottom: 48px; line-height: 1.15;
}
.sentence-row {
  display: flex; flex-wrap: wrap; align-items: baseline;
  gap: 14px 10px; margin-bottom: 32px;
  font-size: 15px; color: var(--white);
}
.sentence-row.optional-row { color: rgba(240,237,232,0.5); }
.sentence-label { white-space: nowrap; }
.optional-tag {
  font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--gray); margin-left: 2px;
}
.sentence-input {
  flex: 1 1 130px; min-width: 100px;
  background: transparent; border: none;
  border-bottom: 1px solid rgba(255,255,255,0.25);
  color: var(--white); font-family: var(--sans); font-size: 15px;
  padding: 4px 2px; outline: none;
  transition: border-color 0.25s;
}
.sentence-input:focus { border-bottom-color: var(--white); }
.sentence-input::placeholder {
  color: rgba(240,237,232,0.3); text-transform: uppercase;
  font-size: 11px; letter-spacing: 0.08em;
}
.email-row {
  margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--border);
}
.form-submit {
  font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--white); background: none;
  border: 1px solid rgba(255,255,255,0.25); padding: 14px 36px;
  cursor: pointer; font-family: var(--sans);
  transition: border-color 0.25s, background 0.25s;
  margin-top: 28px;
}
.form-submit:hover { border-color: var(--white); background: rgba(255,255,255,0.05); }
.form-submit:disabled { opacity: 0.5; cursor: default; }

@media (max-width: 768px) {
  .contact-grid { grid-template-columns: 1fr; }
  .contact-info { padding: 48px 24px; border-right: none; border-bottom: 1px solid var(--border); }

<body>
<div id="nav-mount"></div>

<div class="page-hero">
  <div class="page-hero-label">Свържи се</div>
  <h1 class="page-hero-title">Контакт</h1>
</div>

<div class="contact-grid">
  <div class="contact-info">
    <h2>Нека работим<br>заедно</h2>
    <div class="contact-detail">
      <div class="contact-detail-label">Имейл</div>
      <div class="contact-detail-value"><a href="mailto:georgi@createstudios.eu">georgi@createstudios.eu</a></div>
    </div>
    <div class="contact-detail">
      <div class="contact-detail-label">Телефон</div>
      <div class="contact-detail-value"><a href="tel:+359897823038">+359 897 82 3038</a></div>
    </div>
    <div class="contact-detail">
      <div class="contact-detail-label">Instagram</div>
      <div class="contact-detail-value"><a href="https://instagram.com/_georgilukov" target="_blank">@_georgilukov</a></div>
    </div>
    <div class="contact-detail">
      <div class="contact-detail-label">Партньори</div>
      <div class="contact-detail-value"><a href="https://createstudios.eu" target="_blank">createstudios.eu</a></div>
    </div>
  </div>

  <div class="contact-form">
    <h2 class="contact-greeting">Здравей, Георги,</h2>
    <form id="inquiryForm" action="https://formsubmit.co/ajax/georgi.lukow@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Ново запитване от сайта">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_honey" style="display:none">

      <div class="sentence-row">
        <span class="sentence-label">Казвам се</span>
        <input class="sentence-input" type="text" name="Име" placeholder="Иван Иванов" required>
        <span class="sentence-label">и планирам</span>
        <input class="sentence-input" type="text" name="Тип фотосесия" placeholder="сватба, кръщене, кампания..." required>
      </div>

      <div class="sentence-row optional-row">
        <span class="sentence-label">В <span class="optional-tag">(по избор)</span></span>
        <input class="sentence-input" type="text" name="Локация" placeholder="Пловдив">
        <span class="sentence-label">на <span class="optional-tag">(по избор)</span></span>
        <input class="sentence-input" type="text" name="Дата" placeholder="12 юни 2027">
      </div>

      <div class="sentence-row optional-row">
        <span class="sentence-label">Може да ме намериш <span class="optional-tag">(по избор)</span></span>
        <input class="sentence-input" type="text" name="Instagram" placeholder="@instagram">
        <span class="sentence-label">в Instagram</span>
      </div>

      <div class="sentence-row email-row">
        <span class="sentence-label">Изпрати ми предложение на</span>
        <input class="sentence-input" type="email" name="email" placeholder="email@example.com" required>
      </div>

      <button class="form-submit" type="submit">Изпрати →</button>
    </form>
  </div>
</div>

<div id="footer-mount"></div>
<script src="../photos.js"></script>
<script src="../components.js"></script>
<script>
  document.getElementById('nav-mount').innerHTML = renderNav('contact');
  document.getElementById('footer-mount').innerHTML = renderFooter();

  const inquiryForm = document.getElementById('inquiryForm');
  inquiryForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('.form-submit');
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Изпращане...';
    try {
      const res = await fetch(form.action, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form)
      });
      if (!res.ok) throw new Error('Request failed');
      btn.textContent = 'Изпратено ✓';
      btn.style.borderColor = 'rgba(255,255,255,0.5)';
      form.reset();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Грешка — опитай пак';
      setTimeout(() => { btn.textContent = originalLabel; }, 3000);
    }
  });
</script>
</body>
